plugins { id 'com.android.application' }

// Firma di release: keystore.properties nella cartella del progetto (escluso da git)
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystore.load(new FileInputStream(keystoreFile))

android {
    namespace 'it.pcwebagency.telecamere'
    compileSdk 34
    defaultConfig {
        applicationId 'it.pcwebagency.telecamere'
        minSdk 22
        targetSdk 34
        versionCode 5
        versionName '1.0.4'
        buildConfigField 'String', 'GITHUB_REPO', "\"${project.findProperty('githubRepo') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
        // stessa chiave anche in debug: gli aggiornamenti da GitHub si installano sopra
        debug {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.annotation:annotation:1.8.2"
    implementation "androidx.core:core:1.13.1"
    // annotazioni usate dal modulo RTSP incluso (con patch) in androidx/media3/exoplayer/rtsp
    compileOnly "org.checkerframework:checker-qual:3.42.0"
    compileOnly "com.google.errorprone:error_prone_annotations:2.26.1"
}
